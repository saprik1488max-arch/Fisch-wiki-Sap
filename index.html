  --num: "Unbounded", "Inter", system-ui, sans-serif;     /* широкий шрифт для цифр */
  --wrap: 1200px;
  --pad: max(4vw, calc((100vw - var(--wrap)) / 2));
  --card: min(1020px, 88vw);
  --gap: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body {
  font: 400 17px/1.6 var(--font); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
ul, ol { list-style: none; }
.wrap { width: min(var(--wrap), 92%); margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.spot { position: relative; }
.spot::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s; border-radius: inherit;
  background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.07), transparent 60%);
}
.spot:hover::before { opacity: 1; }
.spot > * { position: relative; z-index: 1; }

/* ============ КНОПКИ ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  padding: 16px 30px; border-radius: 16px; border: 1px solid transparent; cursor: pointer;
  background: var(--gold); color: var(--on-accent); font: 700 14px/1.2 var(--font); letter-spacing: 0.03em; text-transform: uppercase;
  transition: transform 0.25s, box-shadow 0.25s, background 0.25s, border-color 0.25s;
  box-shadow: 0 14px 34px -14px rgba(var(--accent-rgb), 0.85);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 20px 40px -14px rgba(var(--accent-rgb), 0.95); }
.btn-sm { padding: 11px 20px; font-size: 13px; border-radius: 12px; }
.btn-ghost { background: rgba(255, 255, 255, 0.04); color: var(--text); border-color: var(--line-2); box-shadow: none; }
.btn-ghost:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.4); box-shadow: none; }

/* ============ HEADER ============ */
.header {
  position: fixed; inset: 0 0 auto 0; z-index: 100; padding: 14px 0;
  border-bottom: 1px solid transparent; transition: background 0.3s, border-color 0.3s;
}
.header.scrolled { background: rgba(7, 7, 7, 0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom-color: var(--line); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 52px; height: 52px; flex: none; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(247, 195, 37, 0.35)); }
.brand b { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 14px; }
.menu { display: flex; gap: 34px; }
.menu a { color: var(--muted); font-size: 15px; font-weight: 500; transition: color 0.2s; }
.menu a:hover { color: var(--text); }
.nav-right { display: flex; align-items: center; gap: 20px; }

.lang { display: flex; gap: 14px; }
.lang button {
  background: none; border: 0; color: var(--muted); font: 700 13px var(--font);
  padding: 4px 0; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s;
}
.lang button:hover { color: var(--text); }
.lang button.active { color: var(--text); border-bottom-color: var(--accent); }

.burger { display: none; background: none; border: 0; width: 32px; height: 32px; cursor: pointer; position: relative; }
.burger span { position: absolute; left: 4px; right: 4px; height: 2px; background: var(--text); transition: 0.3s; }
.burger span:first-child { top: 11px; }
.burger span:last-child { top: 19px; }
.burger.open span:first-child { top: 15px; transform: rotate(45deg); }
.burger.open span:last-child { top: 15px; transform: rotate(-45deg); }

/* ============ HERO ============ */
.hero { position: relative; padding: 136px 0 40px; overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(46% 60% at 82% 30%, rgba(var(--accent-rgb), 0.22), transparent 70%),
    radial-gradient(40% 50% at 0% 100%, rgba(var(--accent-rgb), 0.14), transparent 70%);
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 70% 30%, #000, transparent 75%);
  mask-image: radial-gradient(ellipse 80% 70% at 70% 30%, #000, transparent 75%);
}
.hero .wrap { position: relative; z-index: 1; }
.hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 56px; align-items: center; }
h1 {
  font-weight: 800; font-size: clamp(30px, 4.2vw, 62px); line-height: 1.02; letter-spacing: -0.035em;
  text-transform: uppercase; text-wrap: balance; overflow-wrap: break-word;
}
.lede { color: var(--muted); font-size: 19px; max-width: 46ch; margin: 24px 0 34px; }
.hero .lede { margin: 22px 0 0; font-size: 18px; max-width: 52ch; color: #d6d6d6; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.hero .actions { margin-top: 34px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px; padding: 8px 16px; border-radius: 999px;
  font-size: 14px; font-weight: 600; color: #fff;
  border: 1px solid rgba(var(--accent-rgb), 0.55); background: rgba(var(--accent-rgb), 0.14);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.7); } 70%, 100% { box-shadow: 0 0 0 10px rgba(var(--accent-rgb), 0); } }

.h-row { margin-top: 26px; }
.mini { color: var(--muted); font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags li { padding: 8px 15px; border-radius: 12px; font-size: 14px; font-weight: 600; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.05); }
.flow { display: flex; flex-wrap: wrap; gap: 8px 6px; counter-reset: f; }
.flow li { counter-increment: f; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.flow li span { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.05); }
.flow li span::before {
  content: counter(f); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 8px;
  font-size: 12px; font-weight: 800; color: #fff; background: var(--gold);
}
.flow li:not(:last-child)::after { content: "→"; color: var(--muted); }

/* Фото в арке с карточками результатов */
.portrait { position: relative; width: min(100%, 440px); margin-left: auto; padding: 0 0 30px; }
.portrait::before {
  content: ""; position: absolute; inset: 4% -14% 6% -14%; z-index: 0; filter: blur(70px);
  background: radial-gradient(60% 60% at 50% 45%, rgba(var(--accent-rgb), 0.36), transparent 70%);
}
.p-frame {
  position: relative; z-index: 1; aspect-ratio: 4 / 5; overflow: hidden;
  border-radius: 220px 220px 36px 36px; border: 1px solid var(--line-2); background: #1b1b1b;
  box-shadow: 0 50px 90px -40px rgba(0, 0, 0, 0.9);
}
.p-frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.p-frame::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.10), transparent 35%, rgba(7, 7, 7, 0.65) 100%);
}
.glass {
  background: rgba(16, 16, 16, 0.78); border: 1px solid var(--line-2);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 22px 50px -22px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.p-card { position: absolute; z-index: 3; left: -36px; bottom: 0; padding: 18px 22px 20px; border-radius: 22px; min-width: 240px; }
.pc-top { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.pc-top b { font-weight: 800; }
.pc-top span { color: var(--muted); }
.pc-big { margin-top: 10px; }
.pc-big b { display: block; font: 600 clamp(28px, 3vw, 38px)/1.05 var(--num); letter-spacing: -0.04em; }
.pc-big span { display: block; margin-top: 6px; color: var(--muted); font-size: 14px; }
.p-chip { position: absolute; z-index: 3; padding: 12px 16px; border-radius: 16px; display: flex; flex-direction: column; }
.p-chip b { font: 600 19px/1.2 var(--num); letter-spacing: -0.03em; color: #fff; }
.p-chip span { color: var(--muted); font-size: 13px; }
.p-chip-a { right: -26px; top: 13%; }
.p-chip-b { right: -16px; bottom: 21%; }

@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.hero h1, .hero .eyebrow, .hero .lede, .hero .h-row, .hero .actions { animation: rise 0.7s both; }
.hero .lede { animation-delay: 0.08s; }
.hero .h-row { animation-delay: 0.14s; }
.hero .h-row + .h-row { animation-delay: 0.2s; }
.hero .actions { animation-delay: 0.26s; }
.portrait { animation: rise 0.9s 0.2s both; }
.p-card, .p-chip { animation: rise 0.7s both; }
.p-card { animation-delay: 0.7s; }
.p-chip-a { animation-delay: 0.85s; }
.p-chip-b { animation-delay: 1s; }
.stats { animation: rise 0.8s 0.5s both; }

/* Цифры: плитки красная / тёмная / белая */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 60px; }
.stats li { padding: 26px 26px 28px; border-radius: 28px; border: 1px solid var(--line); background: var(--surf); min-width: 0; }
.stats b { display: block; font-weight: 800; font-size: clamp(26px, 2.8vw, 40px); line-height: 1.05; letter-spacing: -0.035em; overflow-wrap: break-word; }
.stats span { display: block; margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.stats .t-gold { background: var(--gold); border-color: transparent; }
.stats .t-gold span { color: rgba(255, 255, 255, 0.85); }
.stats .t-white { background: #fff; border-color: #fff; color: #0a0a0a; }
.stats .t-white span { color: #555; }

/* ============ БЛОКИ ============ */
.block { padding: 110px 0 0; }
h2 { font-weight: 800; font-size: clamp(28px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.035em; text-transform: uppercase; margin-bottom: 40px; }

/* ============ ДЛЯ КОГО ============ */
.aud-lede { color: var(--muted); font-size: 18px; max-width: 50ch; margin: -22px 0 34px; }
.aud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.aud-card {
  display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; min-width: 0;
  font: inherit; color: inherit; padding: 26px 24px 24px; border-radius: 28px; border: 1px solid var(--line);
  background: var(--surf); transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.aud-card:nth-child(1) { background: var(--gold); border-color: transparent; }
.aud-card:nth-child(3) { background: #fff; border-color: #fff; color: #0a0a0a; }
.aud-card:hover { transform: translateY(-6px); box-shadow: 0 28px 50px -30px rgba(var(--accent-rgb), 0.8); }
.aud-who { font-weight: 700; font-size: 16px; line-height: 1.3; min-height: 2.6em; }
.aud-num { margin-top: 16px; font: 600 clamp(24px, 2.4vw, 32px)/1.05 var(--num); letter-spacing: -0.04em; color: #fff; overflow-wrap: break-word; }
.aud-card:nth-child(3) .aud-num { color: var(--accent); }
.aud-note { color: var(--muted); font-size: 14px; line-height: 1.4; }
.aud-card:nth-child(1) .aud-note { color: rgba(255, 255, 255, 0.85); }
.aud-card:nth-child(3) .aud-note { color: #555; }
.aud-go { margin-top: 18px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.aud-go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s; }
.aud-card:hover .aud-go svg { transform: translateX(5px); }

/* ============ КЕЙСЫ: карусель ============ */
.cases-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
.cases-head h2 { margin: 0; }
.ctl { display: flex; align-items: center; gap: 12px; }
.count { color: var(--muted); font-size: 15px; font-weight: 600; margin-right: 8px; font-variant-numeric: tabular-nums; }
.count b { color: var(--text); font-size: 20px; margin-right: 4px; }
.arrow {
  width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; cursor: pointer;
  background: transparent; color: var(--text); border: 1px solid var(--line-2);
  transition: background 0.25s, border-color 0.25s, transform 0.25s, opacity 0.25s;
}
.arrow svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.arrow:hover:not(:disabled) { background: var(--gold); border-color: transparent; transform: scale(1.06); }
.arrow:disabled { opacity: 0.3; cursor: default; }

.track {
  position: relative; display: flex; gap: var(--gap); overflow-x: auto; padding: 8px 0 20px var(--pad);
  scroll-snap-type: x mandatory; scroll-padding-left: var(--pad);
  scrollbar-width: none; cursor: grab; overscroll-behavior-x: contain;
}
.track::-webkit-scrollbar { display: none; }
.track.free { scroll-snap-type: none; }
.track.grabbing { cursor: grabbing; user-select: none; }
.spacer { flex: 0 0 0; }

.ccard {
  flex: 0 0 var(--card); scroll-snap-align: start; display: grid; grid-template-columns: 1.1fr 0.9fr;
  border-radius: 32px; border: 1px solid var(--line); background: var(--surf); overflow: hidden;
  opacity: 0.45; transform: scale(0.97); transform-origin: left center;
  transition: opacity 0.45s, transform 0.45s, border-color 0.45s, box-shadow 0.45s;
}
.ccard.active { opacity: 1; transform: none; border-color: rgba(var(--accent-rgb), 0.5); box-shadow: 0 40px 80px -50px rgba(var(--accent-rgb), 0.8); }
.cc-main { padding: 44px; min-width: 0; }
.cc-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.cc-tags span { padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--line-2); }
.cc-tags span:first-child { color: #fff; border-color: transparent; background: var(--gold); }
.ccard h3 { font-weight: 800; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.12; letter-spacing: -0.03em; margin-bottom: 28px; text-transform: uppercase; }
.cc-blk { margin-bottom: 22px; }
.cc-blk h4, .cc-res h4 { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
.cc-blk p { max-width: 52ch; color: #e6e6e6; }
.cc-main > .cc-blk:last-child { margin-bottom: 0; }
.cc-shot { margin-top: 24px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }

.cc-res { padding: 44px 40px; overflow: hidden; background: var(--gold); min-width: 0; }
.cc-res h4 { color: rgba(255, 255, 255, 0.8); }
.cc-res::after {
  content: attr(data-n); position: absolute; right: 18px; bottom: -22px; z-index: 0;
  font: 700 140px/1 var(--num); letter-spacing: -0.06em; color: rgba(255, 255, 255, 0.12); pointer-events: none;
}
.m-first { margin: 8px 0 26px; }
.m-first b { display: block; font: 600 clamp(34px, 3.8vw, 54px)/1.05 var(--num); letter-spacing: -0.05em; color: #fff; overflow-wrap: break-word; }
.m-first span { display: block; margin-top: 10px; color: #fff; font-size: 16px; font-weight: 500; }
.m-rest { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.m { padding: 16px 0; border-top: 1px solid rgba(255, 255, 255, 0.3); min-width: 0; }
.m:last-child:nth-child(odd) { grid-column: 1 / -1; }
.m b { display: block; font: 600 20px/1.15 var(--num); letter-spacing: -0.03em; overflow-wrap: break-word; }
.m span { display: block; margin-top: 6px; color: rgba(255, 255, 255, 0.82); font-size: 14px; line-height: 1.4; }

.slider { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; margin-top: 18px; background: transparent; cursor: grab; }
.slider:active { cursor: grabbing; }
.slider::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 84px; height: 12px; margin-top: -4px; border-radius: 999px; background: var(--gold); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.2); }
.slider:active::-webkit-slider-thumb { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0.25); }
.slider::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); }
.slider::-moz-range-thumb { width: 84px; height: 12px; border: 0; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.2); }
.slider:focus-visible { outline-offset: 6px; }

/* ============ ПОДХОД ============ */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.step { padding: 28px 26px 30px; border-radius: 28px; border: 1px solid var(--line); overflow: hidden; background: var(--surf); transition: transform 0.3s, box-shadow 0.3s; min-width: 0; }
.step:hover { transform: translateY(-6px); box-shadow: 0 28px 50px -30px rgba(var(--accent-rgb), 0.8); }
.step:nth-child(1) { background: #fff; border-color: #fff; color: #0a0a0a; }
.step:nth-child(3) { background: var(--gold); border-color: transparent; }
.ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 22px; color: #fff; background: rgba(var(--accent-rgb), 0.16); border: 1px solid rgba(var(--accent-rgb), 0.4); }
.step:nth-child(1) .ico { color: var(--accent); background: rgba(var(--accent-rgb), 0.1); }
.step:nth-child(3) .ico { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.35); }
.ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.step .n { position: absolute; top: 26px; right: 26px; color: var(--muted); font: 600 14px var(--num); }
.step:nth-child(1) .n { color: #888; }
.step:nth-child(3) .n { color: rgba(255, 255, 255, 0.75); }
.step h3 { font-size: 19px; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; margin-bottom: 8px; }
.step p { color: var(--muted); font-size: 15.5px; }
.step:nth-child(1) p { color: #555; }
.step:nth-child(3) p { color: rgba(255, 255, 255, 0.88); }

/* ============ КОНТАКТЫ ============ */
.contact-card {
  position: relative; overflow: hidden; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center;
  padding: 64px; border-radius: 40px; background: var(--gold);
}
.contact-card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(60% 80% at 100% 0%, rgba(255, 255, 255, 0.22), transparent 65%);
}
.contact-card > * { position: relative; }
.contact-card h2 { margin-bottom: 16px; }
.contact-card .lede { margin: 0; color: rgba(255, 255, 255, 0.9); }
.phone { display: block; font: 600 clamp(24px, 3vw, 38px)/1.1 var(--num); letter-spacing: -0.04em; margin-bottom: 24px; transition: opacity 0.2s; }
.phone:hover { opacity: 0.8; }
.c-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.contact-card .btn { background: #fff; color: #0a0a0a; box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.6); }
.contact-card .btn-ghost { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.7); box-shadow: none; }
.contact-card .btn-ghost:hover { background: rgba(255, 255, 255, 0.14); }

.footer { margin-top: 120px; border-top: 1px solid var(--line); padding: 32px 0 44px; color: var(--muted); font-size: 14px; }
.footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.footer a:hover { color: var(--text); }

.reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal.show { opacity: 1; transform: none; }

/* ============ АДАПТИВ ============ */
@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .aud { grid-template-columns: repeat(2, 1fr); }
  .steps { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1000px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .portrait { margin: 0 auto; width: min(100%, 420px); }
  .p-card { left: -12px; }
  .p-chip-a { right: -10px; }
  .p-chip-b { right: -6px; }
  .stats { margin-top: 48px; }
  .contact-card { grid-template-columns: 1fr; gap: 36px; padding: 44px 32px; }
  .block { padding-top: 88px; }
}
@media (max-width: 900px) {
  .brand span { display: none; }
  .burger { display: block; }
  .nav-right .btn { display: none; }
  .menu {
    position: fixed; inset: 72px 0 auto 0; flex-direction: column; gap: 0;
    background: rgba(7, 7, 7, 0.98); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line); padding: 8px 4%;
    transform: translateY(-130%); transition: transform 0.4s;
  }
  .menu.open { transform: none; }
  .menu a { padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 17px; }

  .track { align-items: flex-start; }
  .ccard { grid-template-columns: 1fr; }
  .cc-main { padding: 32px 28px; }
  .cc-res { padding: 32px 28px; }
}
@media (max-width: 560px) {
  .brand b { font-size: 15px; }
  .logo { width: 44px; height: 44px; }
  .hero { padding-top: 112px; }
  .lede { font-size: 17px; }
  .hero-grid { gap: 40px; }
  .eyebrow { font-size: 13px; border-radius: 14px; padding: 8px 14px; }
  .portrait { width: min(100%, 350px); padding-bottom: 26px; }
  .p-frame { border-radius: 175px 175px 28px 28px; }
  .p-card { left: -6px; padding: 14px 16px 16px; min-width: 0; border-radius: 18px; }
  .p-chip { padding: 9px 13px; border-radius: 13px; }
  .p-chip b { font-size: 15px; }
  .p-chip span { font-size: 12px; }
  .p-chip-a { right: -4px; top: 11%; }
  .p-chip-b { right: -4px; bottom: 27%; }
  .actions .btn { flex: 1 1 100%; }
  .flow li span { padding: 6px 12px 6px 7px; font-size: 13px; }
  .flow li:not(:last-child)::after { display: none; }
  .stats { gap: 10px; }
  .stats li { padding: 20px 18px 22px; border-radius: 22px; }
  .steps { grid-template-columns: 1fr; }
  .aud { gap: 10px; }
  .aud-card { padding: 18px 16px 16px; border-radius: 22px; }
  .aud-who { font-size: 15px; }
  .aud-lede { font-size: 16px; margin-top: -26px; }
  .c-actions .btn { flex: 1 1 100%; }
  .count { display: none; }
  .arrow { width: 44px; height: 44px; }
  .cc-res::after { font-size: 100px; }
  .m-rest { gap: 0 16px; }
}

.callbar { display: none; }
@media (max-width: 760px) {
  .callbar {
    display: flex; gap: 10px; position: fixed; z-index: 90; left: 0; right: 0; bottom: 0;
    padding: 10px 4% calc(10px + env(safe-area-inset-bottom));
    background: rgba(7, 7, 7, 0.9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line-2);
    transform: translateY(110%); transition: transform 0.4s;
  }
  .callbar.show { transform: none; }
  .callbar .btn { flex: 1; padding: 14px 10px; }
  .footer { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; }
}

/* ===== ЗОЛОТАЯ ТЕМА: тёмный текст на жёлтых плитках ===== */
.flow li span::before, .cc-tags span:first-child { color: var(--on-accent); }
.stats .t-gold b { color: var(--on-accent); }
.stats .t-gold span { color: rgba(18, 13, 0, 0.75); }
.aud-card:nth-child(1) { color: var(--on-accent); }
.aud-card:nth-child(1) .aud-num { color: var(--on-accent); }
.aud-card:nth-child(1) .aud-note { color: rgba(18, 13, 0, 0.75); }
.aud-card:nth-child(3) .aud-num { color: #8f6400; }
.arrow:hover:not(:disabled) { color: var(--on-accent); }
.cc-res { color: var(--on-accent); }
.cc-res h4 { color: rgba(18, 13, 0, 0.7); }
.cc-res::after { color: rgba(18, 13, 0, 0.10); }
.m-first b, .m-first span { color: var(--on-accent); }
.m { border-top-color: rgba(18, 13, 0, 0.25); }
.m span { color: rgba(18, 13, 0, 0.75); }
.ico { color: var(--accent); }
.step:nth-child(1) .ico { color: #a87500; background: rgba(247, 195, 37, 0.22); border-color: rgba(168, 117, 0, 0.35); }
.step:nth-child(3) { color: var(--on-accent); }
.step:nth-child(3) .ico { color: var(--on-accent); background: rgba(18, 13, 0, 0.12); border-color: rgba(18, 13, 0, 0.25); }
.step:nth-child(3) .n { color: rgba(18, 13, 0, 0.6); }
.step:nth-child(3) p { color: rgba(18, 13, 0, 0.8); }
.contact-card { color: var(--on-accent); }
.contact-card .lede { color: rgba(18, 13, 0, 0.8); }
.contact-card .btn { background: #0b0b0b; color: #fff; }
.contact-card .btn-ghost { background: transparent; color: var(--on-accent); border-color: rgba(18, 13, 0, 0.55); }
.contact-card .btn-ghost:hover { background: rgba(18, 13, 0, 0.08); }

/* ============ ПРЕДЛОЖЕНИЕ: тест 2 недели и месяц ============ */
.offer { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 14px; }
.o-card { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 40px; border-radius: 32px; border: 1px solid var(--line); background: var(--surf); }
.o-main {
  border-color: rgba(var(--accent-rgb), 0.55);
  background: radial-gradient(70% 60% at 100% 0%, rgba(var(--accent-rgb), 0.2), transparent 70%), var(--surf);
  box-shadow: 0 40px 90px -50px rgba(var(--accent-rgb), 0.7);
}
.o-badge {
  align-self: flex-start; margin-bottom: 18px; padding: 6px 14px; border-radius: 10px; background: var(--gold); color: var(--on-accent);
  font: 800 13px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase;
}
.o-card h3 { font: 800 clamp(24px, 2.6vw, 34px)/1.1 var(--font); letter-spacing: -0.03em; text-transform: uppercase; }
.o-sub { color: var(--muted); margin-top: 6px; }
.o-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; margin: 22px 0 26px; }
.o-price b { font: 800 clamp(38px, 4.6vw, 64px)/1 var(--font); letter-spacing: -0.04em; color: var(--accent); white-space: nowrap; }
.o-price s { color: var(--muted); font: 600 22px var(--font); text-decoration-thickness: 2px; white-space: nowrap; }
.tl { margin-bottom: 22px; }
.tl-bar, .tl-lbl { display: grid; grid-template-columns: 4fr 10fr; gap: 6px; }
.tl-bar i { height: 12px; border-radius: 999px; }
.tl-bar .p { background: rgba(255, 255, 255, 0.32); }
.tl-bar .r { background: var(--gold); }
.tl-lbl { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.tl-lbl span:last-child { color: var(--text); }
.o-steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.o-steps li { padding: 8px 15px; border-radius: 12px; font-size: 14px; font-weight: 600; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.05); }
.o-card .btn { margin-top: auto; align-self: flex-start; }
.o-side { background: #fff; border-color: #fff; color: #0a0a0a; }
.o-side .o-sub { color: #555; }
.o-side .o-price b { color: #0a0a0a; }
.o-side .o-text { color: #444; margin-bottom: 32px; }
.o-side .btn { background: #0b0b0b; color: #fff; box-shadow: none; }
@media (max-width: 1000px) { .offer { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .o-card { padding: 28px 22px; border-radius: 26px; }
  .o-price s { font-size: 18px; }
  .tl-lbl { grid-template-columns: 1fr; gap: 2px; }
  .o-card .btn { align-self: stretch; }
}

/* Обратный отсчёт */
.cd { margin: 0 0 26px; }
.cd-lbl { margin-bottom: 10px; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.cd-row { display: flex; gap: 10px; }
.cd-row > div { flex: 0 0 auto; min-width: 78px; padding: 12px 14px 10px; border-radius: 16px; text-align: center; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line-2); }
.cd-row b { display: block; font: 700 28px/1 var(--num); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.cd-row span { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
.cd-row .cd-s { border-color: rgba(var(--accent-rgb), 0.55); background: rgba(var(--accent-rgb), 0.12); }
.cd-row .cd-s b { color: var(--accent); }
@media (max-width: 560px) {
  .cd-row { gap: 8px; }
  .cd-row > div { flex: 1 1 0; min-width: 0; padding: 10px 6px 8px; border-radius: 14px; }
  .cd-row b { font-size: 21px; }
  .cd-row span { font-size: 11px; }
}

/* =====================================================
   ЛОГИКА: переводчик, карусель кейсов (стрелки, ползунок,
   свайп, перетаскивание), меню, подсветка карточек
   ===================================================== */

let currentLang = "ru";
let activeIdx = 0;
let cards = [];
let sliderDragging = false;

const $ = id => document.getElementById(id);
const tr = v => (typeof v === "string" ? v : v[currentLang]);   // строка или {ru,en,kz}
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const track = $("track");
const prevBtn = $("prev");
const nextBtn = $("next");
const slider = $("slider");

/* ---------- КАРТОЧКИ КЕЙСОВ ---------- */
function renderCards() {
  const t = translations[currentLang];
  track.innerHTML = casesData.map((c, i) => {
    const [first, ...rest] = c.results;
    const restHtml = rest.map(r =>
      `<div class="m"><b>${tr(r.value)}</b><span>${tr(r.label)}</span></div>`
    ).join("");
    const shot = c.image
      ? `<div class="cc-shot"><img src="${c.image}" alt="${tr(c.title)}" loading="lazy" draggable="false"></div>`
      : "";
    return `
      <article class="ccard spot${i === activeIdx ? " active" : ""}" style="--tint:${c.tint}">
        <div class="cc-main">
          <div class="cc-tags"><span>${tr(c.geo)}</span><span>${tr(c.period)}</span></div>
          <h3>${tr(c.title)}</h3>
          <div class="cc-blk"><h4>${t.lbl_task}</h4><p>${tr(c.task)}</p></div>
          <div class="cc-blk"><h4>${t.lbl_solution}</h4><p>${tr(c.solution)}</p></div>
          ${shot}
        </div>
        <div class="cc-res" data-n="${String(i + 1).padStart(2, "0")}">
          <h4>${t.lbl_result}</h4>
          <div class="m-first"><b>${tr(first.value)}</b><span>${tr(first.label)}</span></div>
          <div class="m-rest">${restHtml}</div>
        </div>
      </article>`;
  }).join("") + '<div class="spacer" aria-hidden="true"></div>';

  cards = [...track.querySelectorAll(".ccard")];
  $("cnt-all").textContent = "/ " + String(cards.length).padStart(2, "0");
  layout();
  track.scrollLeft = activeIdx * step();
  update();
}

/* ---------- «ДЛЯ КОГО»: плитки ниш, по клику открывают кейс ---------- */
function renderAudience() {
  const t = translations[currentLang];
  const arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  $("aud").innerHTML = casesData.map((c, i) => `
    <button type="button" class="aud-card" data-i="${i}" style="--tint:${c.tint}">
      <span class="aud-who">${tr(c.who)}</span>
      <b class="aud-num">${tr(c.lead.value)}</b>
      <span class="aud-note">${tr(c.lead.note)}</span>
      <span class="aud-go">${t.aud_go}${arrow}</span>
    </button>`).join("");
  $("aud").querySelectorAll(".aud-card").forEach(btn =>
    btn.addEventListener("click", () => {
      goTo(+btn.dataset.i, false);                     // ставим нужную карточку сразу
      $("cases").scrollIntoView({ behavior: "smooth" });
    })
  );
}

/* шаг прокрутки = расстояние между началами соседних карточек */
function step() {
  if (cards.length > 1) return cards[1].offsetLeft - cards[0].offsetLeft;
  return cards[0] ? cards[0].offsetWidth : 1;
}
function maxScroll() { return track.scrollWidth - track.clientWidth; }

/* добавочное место справа, чтобы последняя карточка тоже вставала к левому краю */
function layout() {
  if (!cards.length) return;
  const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
  const spacer = track.querySelector(".spacer");
  const free = track.clientWidth - cards[0].offsetLeft - cards[0].offsetWidth - gap;
  spacer.style.flex = "0 0 " + Math.max(0, free) + "px";
}

function goTo(i, smooth = true) {
  const n = clamp(i, 0, cards.length - 1);
  track.scrollTo({ left: n * step(), behavior: smooth ? "smooth" : "auto" });
}

/* обновление счётчика, кнопок, ползунка и активной карточки */
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; update(); });
}
function update() {
  if (!cards.length) return;
  const max = maxScroll();
  const left = track.scrollLeft;
  activeIdx = clamp(Math.round(left / step()), 0, cards.length - 1);

  cards.forEach((c, k) => c.classList.toggle("active", k === activeIdx));
  $("cnt-cur").textContent = String(activeIdx + 1).padStart(2, "0");
  prevBtn.disabled = left <= 2;
  nextBtn.disabled = left >= max - 2;
  if (!sliderDragging) slider.value = max > 0 ? Math.round((left / max) * 1000) : 0;
}

/* свободная прокрутка (на время перетаскивания отключаем «прилипание») */
function releaseFree() {
  goTo(clamp(Math.round(track.scrollLeft / step()), 0, cards.length - 1));
  setTimeout(() => track.classList.remove("free"), 450);
}

track.addEventListener("scroll", onScroll, { passive: true });
prevBtn.addEventListener("click", () => goTo(activeIdx - 1));
nextBtn.addEventListener("click", () => goTo(activeIdx + 1));

/* стрелки клавиатуры на ленте и на ползунке */
function onKey(e) {
  if (e.key === "ArrowRight") { e.preventDefault(); goTo(activeIdx + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(activeIdx - 1); }
  else if (e.key === "Home") { e.preventDefault(); goTo(0); }
  else if (e.key === "End") { e.preventDefault(); goTo(cards.length - 1); }
}
track.addEventListener("keydown", onKey);
slider.addEventListener("keydown", onKey);

/* ползунок */
slider.addEventListener("pointerdown", () => { sliderDragging = true; track.classList.add("free"); });
slider.addEventListener("input", () => { track.scrollLeft = (slider.value / 1000) * maxScroll(); });
function endSlider() {
  if (!sliderDragging) return;
  sliderDragging = false;
  releaseFree();
}
slider.addEventListener("change", endSlider);
window.addEventListener("pointerup", endSlider);

/* перетаскивание мышью (на телефоне работает обычный свайп) */
let drag = null;
track.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  drag = { x: e.clientX, s: track.scrollLeft, last: e.clientX };
  track.classList.add("free", "grabbing");
});
window.addEventListener("pointermove", e => {
  if (drag) { drag.last = e.clientX; track.scrollLeft = drag.s - (e.clientX - drag.x); }
});
function endDrag() {
  if (!drag) return;
  const moved = drag.x - drag.last;                       // > 0 — тянули влево (вперёд)
  const start = Math.round(drag.s / step());
  drag = null;
  track.classList.remove("grabbing");
  const target = Math.abs(moved) > 70 ? start + (moved > 0 ? 1 : -1) : start;
  goTo(target);
  setTimeout(() => track.classList.remove("free"), 450);
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

/* ---------- ПЕРЕВОД ---------- */
function setLang(lang) {
  if (!translations[lang]) lang = "ru";
  currentLang = lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  document.documentElement.lang = lang === "kz" ? "kk" : lang;

  const t = translations[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n];
  });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => {
    if (t[el.dataset.i18nAlt] !== undefined) el.setAttribute("alt", t[el.dataset.i18nAlt]);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    if (t[el.dataset.i18nAria] !== undefined) el.setAttribute("aria-label", t[el.dataset.i18nAria]);
  });
  document.querySelectorAll("#lang button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang)
  );
  renderCards();
  renderAudience();
}
document.querySelectorAll("#lang button").forEach(b =>
  b.addEventListener("click", () => setLang(b.dataset.lang))
);

/* ---------- ПОДСВЕТКА КАРТОЧЕК ПОД КУРСОРОМ ---------- */
document.addEventListener("pointermove", e => {
  const el = e.target.closest && e.target.closest(".spot");
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", e.clientX - r.left + "px");
  el.style.setProperty("--my", e.clientY - r.top + "px");
});

/* ---------- МЯГКОЕ ПОЯВЛЕНИЕ ---------- */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("show"); io.unobserve(e.target); }
  });
}, { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* ---------- HEADER + МЕНЮ ---------- */
const header = $("header");
const callbar = $("callbar");
const contactSec = $("contact");
function onPageScroll() {
  header.classList.toggle("scrolled", window.scrollY > 30);
  /* панель звонка: после первого экрана и пока не дошли до блока контактов */
  const r = contactSec.getBoundingClientRect();
  const show = window.scrollY > 500 && r.top > window.innerHeight * 0.55;
  callbar.classList.toggle("show", show);
}
window.addEventListener("scroll", onPageScroll, { passive: true });
onPageScroll();

const burger = $("burger");
const menu = $("menu");
burger.addEventListener("click", () => {
  burger.classList.toggle("open");
  menu.classList.toggle("open");
});
menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
  burger.classList.remove("open");
  menu.classList.remove("open");
}));

/* ---------- СТАРТ ---------- */
$("year").textContent = new Date().getFullYear();
let saved = "";
try { saved = localStorage.getItem("lang") || ""; } catch (e) {}
if (!translations[saved]) saved = (navigator.language || "").toLowerCase().startsWith("kk") ? "kz" : "ru";
setLang(saved);

window.addEventListener("resize", () => {
  layout();
  track.scrollLeft = activeIdx * step();
  update();
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { layout(); track.scrollLeft = activeIdx * step(); update(); });
}

/* ---------- ОБРАТНЫЙ ОТСЧЁТ ДО КОНЦА СКИДКИ ----------
   Дата окончания — в index.html, атрибут data-end у блока id="cd" (формат 2026-11-30T23:59:59+05:00).
   Когда время вышло, счётчик скрывается сам. */
(function () {
  const box = $("cd");
  if (!box) return;
  const end = Date.parse(box.dataset.end);
  const out = { d: $("cd-d"), h: $("cd-h"), m: $("cd-m"), s: $("cd-s") };
  const pad = n => String(n).padStart(2, "0");
  let timer;
  function tick() {
    const left = end - Date.now();
    if (isNaN(end) || left <= 0) { box.style.display = "none"; clearInterval(timer); return; }
    const sec = Math.floor(left / 1000);
    out.d.textContent = pad(Math.floor(sec / 86400));
    out.h.textContent = pad(Math.floor(sec % 86400 / 3600));
    out.m.textContent = pad(Math.floor(sec % 3600 / 60));
    out.s.textContent = pad(sec % 60);
  }
  tick();
  timer = setInterval(tick, 1000);
})();

</script>
</body>
</html>
